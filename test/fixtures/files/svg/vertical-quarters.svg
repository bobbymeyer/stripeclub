<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <pattern id="vertical-quarters" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="15" height="60" fill="#FFFFFF"/>
      <rect x="15" y="0" width="15" height="60" fill="#AAAAAA"/>
      <rect x="30" y="0" width="15" height="60" fill="#555555"/>
      <rect x="45" y="0" width="15" height="60" fill="#000000"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#vertical-quarters)"/>
</svg>
